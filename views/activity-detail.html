    var OTHER_SECTOR_KEY = '__other__';

    var sectorsById = {};

    var useSectors = false;

    // Sector thumbnail zoom: a fixed overlay copy, since the table clips transformed content.
    (function(){
        var source = null, overlay = null;

        function show(img){
            hide(true);
            var r = img.getBoundingClientRect();
            var vw = document.documentElement.clientWidth, vh = window.innerHeight, pad = 8;
            var s = Math.max(1.01, Math.min(5, (vw - 2 * pad) / r.width, (vh - 2 * pad) / r.height));
            var left = Math.min(Math.max(pad, r.left + r.width * (1 - s) / 2), Math.max(pad, vw - pad - s * r.width));
            var top = Math.min(Math.max(pad, r.top + r.height * (1 - s) / 2), Math.max(pad, vh - pad - s * r.height));
            overlay = document.createElement('img');
            overlay.className = 'sector-zoom-overlay';
            overlay.src = img.currentSrc || img.src;
            overlay.alt = '';
            Object.assign(overlay.style, {left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px',
                transformOrigin: (r.left - left) / (s - 1) + 'px ' + (r.top - top) / (s - 1) + 'px'});
            overlay.style.setProperty('--zoom', s);
            document.body.appendChild(overlay);
            var full = new Image(), target = overlay;
            full.onload = function(){ target.src = full.src; };
            full.src = img.dataset.full;
            overlay.getBoundingClientRect();
            overlay.classList.add('is-zoomed');
            source = img;
        }

        function hide(immediate){
            if (!overlay) return;
            var node = overlay;
            overlay = null; source = null;
            if (immediate) { node.remove(); return; }
            node.classList.remove('is-zoomed');
            setTimeout(function(){ node.remove(); }, 250);
        }

        // capture phase so the click never reaches Tabulator's group toggle
        document.addEventListener('click', function(e){
            var img = e.target.closest && e.target.closest('.sector-thumb-zoom');
            if (img) {
                e.stopPropagation();
                if (source === img) hide(); else show(img);
            } else if (overlay) {
                if (e.target === overlay) e.stopPropagation();
                hide();
            }
        }, true);
        window.addEventListener('scroll', function(){ hide(true); }, {passive: true, capture: true});
    })();

    function setSectorLayout(layout){
        sectorsById = {};
        lineToSectorId = {};
        if (!layout || !Array.isArray(layout.sectors)) return;
        layout.sectors.forEach(function(sector, index){
            sectorsById[sector.id] = {sector: sector, index: index};
            (sector.lines || []).forEach(function(line){
                lineToSectorId[String(line).trim()] = sector.id;
            });
        });
    }

    function getSectorKey(route){
        return lineToSectorId[String(route.line ?? '').trim()] || OTHER_SECTOR_KEY;
    }

    function getSectorIndex(route){
        var entry = sectorsById[getSectorKey(route)];
        return entry ? entry.index : Number.MAX_SAFE_INTEGER;
    }

    function escapeSectorHtml(str){
        return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function sectorGroupHeader(value, count, data, group){
        var entry = sectorsById[value];
        var name = entry ? entry.sector.name : OTHER_SECTOR_LABEL;
        var thumb = '';
        if (entry && entry.sector.thumb_id){
            var fullUrl = '/image/' + encodeURIComponent(entry.sector.img_id || entry.sector.thumb_id);
            var thumbUrl = '/image/' + encodeURIComponent(entry.sector.thumb_id);
            thumb = `<img class="sector-thumb-zoom" data-full="${fullUrl}" src="${thumbUrl}" loading="lazy" alt="" style="height:96px; width:72px; object-fit:cover; border-radius:4px; margin-right:8px; vertical-align:middle;">`;
        }
        return "<span style='display:inline-flex; align-items:center; vertical-align:middle;'>" + thumb +
            "<span style='display:inline-flex; flex-direction:column; line-height:1.2;'>" +
            "<span style='font-size: 1.3rem; font-weight: 700;'>" + escapeSectorHtml(name) + "</span>" +
            "<span style='font-size: 0.9rem; font-weight: normal; color:#888;'>(" + count + ")</span>" +
            "</span></span>";
    }

    function lineGroupHeader(value, count, data, group){
        var colorDivs = "";
        for (let i = 0; i < count; i++) {
            colorDivs += getColorSVGDiv(data[i].color1, data[i].color2, data[i].color_modifier, '55px', '20px', data[i].grade) +
                ` &nbsp;&nbsp;&nbsp;`;
        }
        const encompassingDiv = `<div style="display: flex; gap: 3px;">${colorDivs}</div>`;

        return "<span style='font-size: 1.0rem'> {{reference_data['current_language'].line}}   " + value +
            encompassingDiv + "</span>";
    }

    // sector order first (layout order), then natural line order ("10" after "9"), then routenum
    function compareRoutesByLine(a, b){
        if (useSectors){
            var sa = getSectorIndex(a), sb = getSectorIndex(b);
            if (sa !== sb) return sa - sb;
        }
        var cmp = String(a.line ?? '').localeCompare(String(b.line ?? ''), undefined, {numeric:true, sensitivity:'base'});
        if (cmp !== 0) return cmp;
        return (parseFloat(a.routenum) || 0) - (parseFloat(b.routenum) || 0);
    }

    function renderGymRoutesTabulatorTable(routesA)
      {
        useSectors = Object.keys(sectorsById).length > 0;
        var columns = [
            {title: "{{ reference_data['current_language'].route_num}}", visible:false, field: "routenum", "responsive": 0 , minWidth:2, width:60, headerVertical:false},
            {title: "{{ reference_data['current_language'].line }}", field: "line", "responsive": 0 , minWidth:2, width:60, headerVertical:false,
                sorter:function(a, b, aRow, bRow){
                    return compareRoutesByLine(aRow.getData(), bRow.getData());
                },
                formatter:function(cell, formatterParams, onRendered){
                    return `${cell.getValue()} <sup>${cell.getRow().getData().routenum}</sup>`;
                },
            
            },
            
            {title: "{{ reference_data['current_language'].color }}", field: "color1", 
            "responsive": 0 , minWidth:10, 
            formatter:function(cell, formatterParams, onRendered){ 
                return getColorSVGDiv(cell.getValue(), cell.getRow().getData().color2, cell.getRow().getData().color_modifier, '100px', '50px', cell.getRow().getData().grade);
                },
            
            formatterPrint:function(cell, formatterParams, onRendered){
                return getColorSVGDiv(cell.getValue(), cell.getRow().getData().color2, cell.getRow().getData().color_modifier, '100px', '50px', cell.getRow().getData().grade);
                },
            },
            //{title: "{{ reference_data['current_language'].grade }}", field: "grade", "responsive": 0 , minWidth:10, headerVertical:false},
            {title: "{{ reference_data['current_language'].route_name }}", field: "name", "responsive": 1 , minWidth:10},
            //{title: "{{ reference_data['current_language'].route_opened_by}}", field: "openedby", "responsive": 2 , minWidth:10},
            //{title: "{{ reference_data['current_language'].route_opened_date}}", field: "opendate", "responsive": 2},
            //{title: "{{ reference_data['current_language'].notes}}", field: "notes", "responsive": 1 , formatter:"plaintext"}
            ];
        
          // Create the Tabulator table
        table = new Tabulator("#tabulator-table", {
            columns: columns,
            data: (routesA || []).slice().sort(compareRoutesByLine),
            initialSort: [
                {column: "line", dir: "asc"}
            ],
            layout:"fitDataStretch",
            //layout: "fitDataFill",
            movableRows: true,
            selectable: 1,
            responsiveLayout:"collapse",
            //responsiveLayout:"fitColumns",
            //movableColumns: true, 
            responsiveLayoutCollapseStartOpen:false,
            groupBy: useSectors ? [getSectorKey, "line"] : "line",
            groupToggleElement:"header",
            // sectors start open, line groups start closed
            groupStartOpen:function(value, count, data, group){
                return useSectors && !group.getParentGroup();
            },
            groupHeader: useSectors ? [sectorGroupHeader, lineGroupHeader] : lineGroupHeader,
            formatter:"responsiveCollapse", headerSort:true,
            rowFormatter:function(row){
            if(row.getData().line % 2 == 0){
                    //row.getElement().style.backgroundColor = "#dddddd";
                    //row.getElement().classList.add("celled"); //mark rows with age less than 18 with a warning state;
                    row.getElement().style.backgroundColor = "#f1f1f1";
                
                }else{
                    row.getElement().style.backgroundColor = "#ffffff";
                
                }
                },

              /*rowContextMenu:[
              {
                label:"Edit Row",
                action:function(e, row){
                    row.delete();

                },
                {
                    label:"Delete Row",
                    action:function(e, row){
                        row.delete();
                    }
                },
            ]*/
          });

    function deleteRoute(attemptId)
    {
        //console.log("delete attempt  "+attemptId);
        if (attemptId == undefined || attemptId.length == 0)
        {
            return;
        }
        // optimistic removal: hide row immediately
        const rowEl = document.querySelector(`#attemptsBody tr td a[onclick*="${attemptId}"]`)?.parentElement?.parentElement;
        if(rowEl){ rowEl.style.opacity='0.4'; }
        apiFetchJson(`/api1/activity/${ACTIVITY_ID}/route/${attemptId}`, { method: 'DELETE'})
            .then(data => {
                if(data.error){ console.error(data.error); return; }
                handleActivityResponse(data);
            })
            .catch(error => console.error(error));
    }

    // Called by the Save button with a status (e.g. 'climbed' or 'flashed').

                return;
            }

            const userGrade = (document.getElementById('route-grade-user')?.value || '').trim();
            const note = (document.getElementById('notes')?.value || '').trim();
            const chosenStatus = status || 'attempted';
            const existingAttempt = (activity?.attempts||[]).find(a => a.route_id === routeId);
            if(existingAttempt && (existingAttempt.attempt_id || existingAttempt.route_id)){
                const attemptId = existingAttempt.attempt_id || existingAttempt.route_id; // fallback to legacy route id
                const payload = { status: chosenStatus, user_grade: userGrade, note }; 
                apiFetchJson(`/api1/activity/${ACTIVITY_ID}/attempt/${attemptId}`, { method: 'PUT', body: payload })
                    .then(data => {
                        handleActivityResponse(data);
                        showErrorMessage('{{ reference_data["current_language"].saved if reference_data["current_language"].get("saved") else "Saved" }}', true);
                    })
                    .catch(err => {
                        console.error('update attempt failed', err);
                        showErrorMessage(err?.error || 'error_saving');
                    });
            } else {
                // create new attempt via POST /activity/<activity_id>
                const createPayload = {
                    gym_id: activity?.gym_id,
                    routes_id: activity?.routes_id,
                    route_id: routeId,
                    note: note,
                    route_finish_status: chosenStatus, // map status -> route_finish_status legacy field
                    'route-grade-user': userGrade
                };
                apiFetchJson(`/api1/activity/${ACTIVITY_ID}`, { method: 'POST', body: createPayload })
                    .then(data => {
                        handleActivityResponse(data);
                        showErrorMessage('{{ reference_data["current_language"].saved if reference_data["current_language"].get("saved") else "Saved" }}', true);
                    })
                    .catch(err => {
                        console.error('create attempt failed', err);
                        showErrorMessage(err?.error || 'error_saving');
                    });
            }
        } catch(ex){
            console.error('saveData exception', ex);
        }
    }

    function statusIcon(status){
        if(status === 'climbed') return '<img src="/public/images/1398911_correct_mark_success_tick_valid_icon.png" width="30" height="30" alt="climbed">';
        if(status === 'flashed') return '<img src="/public/images/2682840_bolt_elictricity_light_lightning_storm_icon.png" width="30" height="30" alt="flashed">';
        return '<img src="/public/images/4125784_confounded_confused_emoji_emotion_fail_icon.png" width="30" height="30" alt="attempted">';
    }

    function renderAttempts(){
        const tbody = document.getElementById('attemptsBody');
        if(!tbody) return;
        tbody.innerHTML='';
        const attempts = activity?.attempts || [];
        attempts.forEach(att => {
            // Each attempt already includes route snapshot fields
            const disagreement = (att.user_grade && att.grade && att.user_grade !== att.grade);
            const attemptKey = att.attempt_id || att.route_id;
            const stars = Number(att.route_stars || 0);
            const starsHtml = (function(n){
                const count = Math.max(0, Math.min(3, Number(n||0)));
                let out = '';
                for(let i=0;i<3;i++){
                    out += `<span style="color:${i<count?'#FFD600':'#ddd'}; font-size:1.1rem; line-height:1;">\u2605</span>`;
                }
                return `<div class='attempt-stars' style='margin-top:4px;'>${out}</div>`;
            })(stars);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class='route-cell'>
                    <div class='route-cell-inner'>
                        <span class='route-color'>${getColorSVGDiv(att.color1 || '', att.color2 || '', att.color_modifier || 'solid', '50px','25px', att.grade)}</span>
                      
                        <span class='route-name'>${att.name || ''}</span>
                    </div>
                </td>
                <td>${starsHtml}</td>
                <td class='status-cell'>${statusIcon(att.status)}</td>
                <td class='user-grade-cell'>${disagreement?`<i>${att.user_grade}</i>`:(att.user_grade||'')}</td>
                <td class='note-cell'><i>${att.note || ''}</i></td>
                <td class='text-nowrap action-cell'>
                    <a href='#' onclick="openAttemptModal('${attemptKey}');return false;" title='Edit attempt'>
                        <i class='bi bi-pencil-square' style='font-size: 1.3rem; color:#198754;'></i>
                    </a>
                </td>`;
            tbody.appendChild(tr);
        });
    }

    
    
        
    function enterEditActivityName(){
        const current = activity?.name || '';
        document.getElementById('activityNameInput').value = current;
        document.getElementById('activityName').style.display='none';
        document.getElementById('activityNameEdit').style.display='none';
        document.getElementById('activityNameEditControls').style.display='inline-block';
    }
    function cancelEditActivityName(){
        document.getElementById('activityName').style.display='inline';
        document.getElementById('activityNameEdit').style.display='inline';
        document.getElementById('activityNameEditControls').style.display='none';
    }
    function saveActivityName(){
        const newName = document.getElementById('activityNameInput').value.trim();
        if(!newName){ return; }
        apiFetchJson(`/api1/activity/${ACTIVITY_ID}`, { method: 'PUT', body: { name: newName } })
            .then(data => {
                if(data.error){ console.error(data.error); return; }
                activity = data;
                document.getElementById('activityName').textContent = activity.name || '';
                cancelEditActivityName();
            })
            .catch(err => console.error(err));
    }


        // ---------- POPUP ATTEMPT EDIT (Mobile Friendly) ----------
        let attemptModalEl;
        let currentRouteId = null; // Used when creating a brand new attempt
        function ensureAttemptModal(){
            // Modal now exists statically in DOM; just cache reference
            if(!attemptModalEl){
                attemptModalEl = document.getElementById('attemptEditModal');
            }
        }
        let currentAttemptKey = null;

        function populateAttemptModal(route, attemptKey){
            ensureAttemptModal();
            console.log('populateAttemptModal', route, attemptKey);
            // clear previous error
            const errEl = document.getElementById('attemptModalError');
            if(errEl){ errEl.style.display='none'; errEl.textContent=''; }

            // Status / Grade / Note
            route_status = route.status || 'climbed';
            document.getElementById('attemptModalStatus').value = route_status;
            document.getElementById('attemptModalGrade').value = route.user_grade || route.grade || '?';
            document.getElementById('attemptModalNote').value = route.note || '';

            // Stars
            const starsVal = parseInt(route.route_stars || 0);
            const starsInputs = document.querySelectorAll('#attemptStars input[name="attempt_stars"]');
            starsInputs.forEach(r=>{ r.checked = false; });
            if(starsVal >= 1 && starsVal <= 3){
                const radio = document.getElementById('attemptStars'+starsVal);
                if(radio) radio.checked = true;
            }

            // Route info section
            const colorEl = document.getElementById('attemptRouteColor');
            const nameEl = document.getElementById('attemptRouteName');
            if(colorEl){ colorEl.innerHTML = getColorSVGDiv(route.color1 || '', route.color2 || '', route.color_modifier || 'solid', '60px','30px', route.grade); }
            if(nameEl){ nameEl.textContent = route.name || route.routenum || ''; }

            // Delete button visibility
            const delBtn = document.getElementById('attemptModalDeleteBtn');
            console.log('attemptKey for delete btn:', attemptKey);
            delBtn.style.display = attemptKey ? '' : 'none'; 

            // Status buttons UI + click handlers
            attemptModalEl.querySelectorAll('.status-btn').forEach(btn => {
                const isActive = btn.getAttribute('data-status') === route_status;
                btn.classList.toggle('active', isActive);
                btn.onclick = () => {
                    attemptModalEl.querySelectorAll('.status-btn').forEach(b=>b.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById('attemptModalStatus').value = btn.getAttribute('data-status');
                };
            });

            attemptModalEl.style.display='flex';
        }

        function openAttemptModal(attemptKey){
            console.log('openAttemptModal', attemptKey);
            ensureAttemptModal();
            currentAttemptKey = attemptKey;

            const attemptObj = (activity.attempts||[]).find(a => (a.attempt_id||a.route_id) === attemptKey);
            if(!attemptObj){ console.error('Attempt not found'); return; }

            // Build preset from existing attempt
            const preset = {
                showDelete: true
            };

            populateAttemptModal(attemptObj, attemptKey);
        }

        // Open attempt modal for a route that may not yet have an attempt (creation flow)
        function openAttemptModalForRoute(routeData){
            console.log('Opening attempt modal for route: openAttemptModalForRoute', routeData);
            ensureAttemptModal();
            if(!routeData || !routeData.id){ console.error('Route data missing'); return; }
            currentRouteId = routeData.id; // keep for creation

            // Preset defaults for new attempt
            const preset = {
                showDelete: false
            };

            populateAttemptModal(routeData, null);

            // Hide the route selection modal if open
            if(modal) modal.style.display='none';
        }



    function closeAttemptModal(){
            if(attemptModalEl) attemptModalEl.style.display='none';
            currentAttemptKey = null;
    }
    
    function submitAttemptModal(e){
            e.preventDefault();
            // For new attempt, currentAttemptKey may be null; fallback to currentRouteId
            let attemptObj = null;
            if(currentAttemptKey){
                attemptObj = (activity.attempts||[]).find(a => (a.attempt_id||a.route_id) === currentAttemptKey);
            }
            const routeId = attemptObj?.route_id || currentRouteId;
            if(!routeId){ console.error('route_id missing (creation/update)'); return; }
            const statusVal = document.getElementById('attemptModalStatus').value;
            const userGradeVal = document.getElementById('attemptModalGrade').value.trim();
            const noteVal = document.getElementById('attemptModalNote').value.trim();
            const starsChecked = document.querySelector('#attemptStars input[name="attempt_stars"]:checked');
            const starsVal = starsChecked ? parseInt(starsChecked.value) : 0;
            if(attemptObj && (attemptObj.attempt_id || attemptObj.route_id)){
                // UPDATE existing attempt
                const attemptId = attemptObj.attempt_id || attemptObj.route_id;
                const payload = { status: statusVal, user_grade: userGradeVal, note: noteVal, route_stars: starsVal };
                apiFetchJson(`/api1/activity/${ACTIVITY_ID}/attempt/${attemptId}`, { method: 'PUT', body: payload })
                    .then(data => {
                        console.log(data);
                        closeAttemptModal();
                        handleActivityResponse(data);
                    })
                    .catch(err => {
                        console.error(err);
                        showErrorMessage(err?.error || 'error_updating_attempt');
                    });
            } else {
                // CREATE new attempt via POST
                const createPayload = {
                    gym_id: activity?.gym_id,
                    routes_id: activity?.routes_id,
                    route_id: routeId,
                    note: noteVal,
                    route_finish_status: statusVal,
                    'route-grade-user': userGradeVal,
                    route_stars: starsVal
                };
                apiFetchJson(`/api1/activity/${ACTIVITY_ID}`, { method: 'POST', body: createPayload })
                    .then(data => {
                        closeAttemptModal();
                        handleActivityResponse(data);
                    })
                    .catch(err => {
                        console.error(err);
                        showErrorMessage(err?.error || 'error_creating_attempt');
                    });
            }
        }
        function deleteAttemptFromModal(){
        // Allow delete only if existing attempt
        if(!currentAttemptKey){ return; }
        const attemptObj = (activity.attempts||[]).find(a => (a.attempt_id||a.route_id) === currentAttemptKey);
        const routeId = attemptObj?.route_id;
        if(!routeId){ console.error('route_id missing for delete'); return; }
                apiFetchJson(`/api1/activity/${ACTIVITY_ID}/route/${routeId}`, { method:'DELETE' })
                    .then(data => {
                        closeAttemptModal();
                        handleActivityResponse(data);
                    })
                    .catch(err => {
                        console.error(err);
                        showErrorMessage(err?.error || 'error_deleting_attempt');
                    });
        }
        // Generic error message dispatcher: shows in attempt modal if open, else legacy hidden_message
        function showErrorMessage(msg, success){
            if(attemptModalEl && attemptModalEl.style.display === 'flex'){
                const errEl = document.getElementById('attemptModalError');
                if(errEl){
                    errEl.textContent = msg;
                    errEl.style.display = 'block';
                    errEl.classList.toggle('alert-success', !!success);
                    errEl.classList.toggle('alert-danger', !success);
                }
            } else {
                const hm = document.getElementById('hidden_message');
                if(hm){ hm.textContent = msg; }
            }
        }
</script>
