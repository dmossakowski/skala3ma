        views: {

                type: 'list',
                duration: { month: 12 },
                buttonText: 'List',
                listDayFormat: { weekday: 'long', day: 'numeric' },
                listDaySideFormat: false,
                displayEventTime: false,
                eventContent: function(info) {
                    const p = info.event.extendedProps;
                    const wrap = document.createElement('div');
                    wrap.className = 'list-event';

                    const img = document.createElement('img');
                    img.className = 'list-event-img';
                    img.src = `/image/${encodeURIComponent(p.id)}`;

                    link.textContent = info.event.title;
                    const meta = document.createElement('div');
                    meta.className = 'list-event-meta';
                    meta.textContent = [p.gym, p.text && p.text.series].filter(Boolean).join(' · ');
                    body.append(link, meta);

                    wrap.append(img, body);

        eventClick: function(info) {

            if (calendar.view.type !== 'multiMonthFourMonth') {

            info.jsEvent.preventDefault(); // Prevent the browser from navigating to the event URL

            document.getElementById('eventLink').href = `/competitionDetails/${info.event.extendedProps.id}`;
            document.getElementById('eventTitle').textContent = info.event.title;
            document.getElementById('eventGym').textContent = info.event.extendedProps.gym;
            document.getElementById('eventKind').textContent = info.event.extendedProps.text.series || '';
            document.getElementById('eventStatus').textContent = info.event.extendedProps.text.status;
            document.getElementById('eventButton').href = `/competitionDetails/${info.event.extendedProps.id}`;
          
            
            // Show the modal
            var eventModal = new bootstrap.Modal(document.getElementById('eventModal'));
            eventModal.show();
        },
        noEventsContent: function() {
            return ':|';
        },
        
       

        events: function(info, successCallback, failureCallback) {
        fetch('/api1/competition/list')
          .then(response => response.json())
          .then(data => {
            // Ensure each event object has an extendedProps object that is a shallow copy
            // of its own top-level properties (excluding any existing extendedProps to avoid recursion).
            // This lets FullCalendar access all original fields via event.extendedProps.*
            const eventFilter = document.getElementById('eventFilter').value;
            const matching = Array.isArray(data) ? data.filter(ev => eventFilter === 'all' || ev.series_key === eventFilter) : data;
            const processed = Array.isArray(matching) ? matching.map(ev => {
                if (ev && typeof ev === 'object') {
                    const { extendedProps, ...rest } = ev;
                    return {
                        ...ev,
                        extendedProps: {
                            ...rest, // copy all root-level fields
                            ...(extendedProps || {}) // preserve/merge any existing extendedProps
                        }
                    }
                }
                return ev; // non-object entries passed through unchanged
            }) : data;
            successCallback(processed);
          })
          .catch(error => {
            failureCallback(error);
          });
      },



       

    });


        calendar.render();

        // Label the first listed day of each month so CSS can render a month heading above it
        function markMonthStarts() {
            let prevMonth = null;
            calendarEl.querySelectorAll('tr.fc-list-day').forEach(tr => {
                const th = tr.querySelector('th');
                const date = tr.dataset.date || '';
                const month = date.slice(0, 7);
                if (!th) return;
                if (month && month !== prevMonth) {
                    const label = new Date(date + 'T00:00:00').toLocaleDateString(language, { month: 'long', year: 'numeric' });
                    if (th.dataset.month !== label) th.dataset.month = label;
                } else if (th.hasAttribute('data-month')) {
                    th.removeAttribute('data-month');
                }
                prevMonth = month;
            });
        }
        markMonthStarts();
        new MutationObserver(markMonthStarts).observe(calendarEl, { childList: true, subtree: true });

        document.getElementById('eventFilter').addEventListener('change', function() {
            calendar.refetchEvents();
        });
    });
