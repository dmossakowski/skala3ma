


{% extends "skala3ma-layout.html" %}

{% block topcontent %}

{% endblock %}


	{% block secondarycontent %}

	<div class="container-fluid">
		<div class="col-md-8 col-md-offset-2 text-left heading-section animate-box">
			<br>
			<h3>{{ reference_data['current_language'].add_new }} </h3>
			<div class="container">
				<form id="new-gym-form" action="/gyms/add" method="post" enctype="multipart/form-data">
					<div class="row">
						<!-- Left Column -->
						<div class="col-md-6">
							<div class="form-floating mb-3">
								<input type="text" class="form-control" id="gymName" name="gymName" placeholder="Name" required>
								<label for="gymName">{{ reference_data['current_language'].nazwa }}:</label>
							</div>
							<div class="form-floating mb-3">
								<input type="number" class="form-control" id="numberOfRoutes" name="numberOfRoutes" placeholder="Routes" min="1" inputmode="numeric">
								<label for="numberOfRoutes">{{ reference_data['current_language'].number_of_routes }}:</label>
							</div>
							<div class="form-floating mb-3">
								<input type="text" class="form-control" id="address" name="address" placeholder="Address" autocomplete="street-address">
								<label for="address">{{ reference_data['current_language'].address }}:</label>
							</div>
						</div>
						<!-- Right Column -->
						<div class="col-md-6">
							<div class="form-floating mb-3">
								<input type="text" class="form-control" id="url" name="url" placeholder="Link" inputmode="url">
								<label for="url">{{ reference_data['current_language'].link }}:</label>
							</div>
							<div class="form-floating mb-3">
								<input type="text" class="form-control" id="organization" name="organization" placeholder="Organization">
								<label for="organization">{{ reference_data['current_language'].organization }}:</label>
							</div>
							<div class="mb-3">
								<label for="file1" class="form-label">Logo (max 4MB):</label>
								<input class="form-control" type="file" name="file1" id="file1" accept="image/*">
							</div>
						</div>
					</div>
					<!-- Submit Button Row -->
					<div class="row">
						<div class="col-12">
							<button type="submit" class="btn btn-primary btn-lg w-100">{{ reference_data['current_language'].submit }}</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>

{% endblock %}
